<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>핵심 일정 · 써니의 투자 인사이트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"></noscript>
<link rel="prefetch" href="index.html">
<style>
  :root{
    --bg:#0a0b0d; --panel:#16181c; --panel2:#1c1f25; --border:#2a2d34;
    --text:#f5f7fa; --muted:#a8acb3; --muted2:#7c828a;
    --accent:#1268ff; --accent2:#5b8cff; --gold:#f4b000;
    --up:#f6465d; --down:#3b82f6; --chip:#1c1f25;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text); font-family:"Pretendard Variable","Pretendard","Inter","Segoe UI",-apple-system,"Malgun Gothic",sans-serif; font-size:14px; line-height:1.5; letter-spacing:-0.01em;
  }
  body.light{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f2f3f5; --border:#dee1e6;
    --text:#0a0b0d; --muted:#5b616e; --muted2:#8a909a;
    --accent:#0052ff; --accent2:#3d7bff; --gold:#a8780a;
    --up:#d4243a; --down:#2f6bdb; --chip:#eef0f3;
  }
  body.light header.topbar{background:rgba(255,255,255,.82)}
  .btn{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  a{color:inherit;text-decoration:none}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  header.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:10px 22px;background:rgba(10,14,23,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#ffffff;font-weight:900;font-size:13px}
  .brand small{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:0}
  nav.mainnav{display:flex;gap:4px}
  nav.mainnav a{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid transparent}
  nav.mainnav a:hover{color:var(--text);border-color:var(--border)}
  nav.mainnav a.active{color:#ffffff;background:var(--accent)}
  .spacer{flex:1}
  .clock{font-size:13px;color:var(--muted);font-weight:600}
  .live-ind{font-size:10.5px;font-weight:800;color:#22c55e;border:1px solid #14532d;background:#06210f;padding:4px 8px;border-radius:6px;letter-spacing:.4px}

  /* 필터바 */
  .filterbar{position:sticky;top:53px;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 22px;background:rgba(10,14,23,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel)}
  .seg button{border:none;background:transparent;color:var(--muted);padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--accent);color:#ffffff}
  .seg button:hover:not(.on){color:var(--text)}
  .fb-label{font-size:11px;color:var(--muted2);font-weight:700;margin-left:4px}
  .legend{margin-left:auto;font-size:11px;color:var(--muted2)}
  .legend b{color:var(--gold)}

  main{padding:18px 22px 50px;max-width:1500px;margin:0 auto}
  .sectit{display:flex;align-items:center;gap:9px;margin:4px 2px 12px;font-size:14px;font-weight:800}
  .sectit .cnt{font-size:11px;color:var(--muted);font-weight:600;border:1px solid var(--border);padding:1px 7px;border-radius:6px}

  /* 핵심 하이라이트 */
  .hirow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .hicard{border:1px solid var(--border);border-radius:13px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:13px 14px;position:relative;overflow:hidden}
  .hicard.kr{border-left:3px solid var(--up)} .hicard.us{border-left:3px solid var(--accent)}
  .hicard .when{font-size:11px;color:var(--gold);font-weight:800}
  .hicard h4{margin:7px 0 4px;font-size:14px;line-height:1.35;font-weight:800}
  .hicard .det{font-size:11.5px;color:var(--muted);line-height:1.5}
  .hicard .flag{font-size:11px;font-weight:700;color:var(--muted2)}

  /* 2열 KR/US */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .col{border:1px solid var(--border);border-radius:14px;background:var(--panel);overflow:hidden}
  .col > .colhead{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:1}
  .col > .colhead h3{margin:0;font-size:14px;font-weight:800}
  .col .feed{max-height:1600px;overflow:auto}
  .feed::-webkit-scrollbar{width:8px}.feed::-webkit-scrollbar-thumb{background:#22324f;border-radius:8px}

  .daygrp{border-bottom:1px solid #141d31}
  .dayhd{display:flex;align-items:center;gap:8px;padding:8px 15px;background:#0c1424;position:sticky;top:0;z-index:2;
    font-size:12px;font-weight:800;color:var(--accent)}
  .dayhd.today{color:var(--gold)}
  .dayhd .dow{color:var(--muted2);font-weight:600}
  .dayhd .n{margin-left:auto;font-size:10.5px;color:var(--muted2);font-weight:600}

  .ev{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid #10192c}
  .ev:last-child{border-bottom:none}
  .ev .tm{flex:none;width:46px;font-size:12px;font-weight:800;color:var(--text);padding-top:1px}
  .ev .tm small{display:block;color:var(--muted2);font-size:9.5px;font-weight:600}
  .ev .bd{min-width:0;flex:1}
  .ev .ti{font-size:13px;font-weight:700;line-height:1.35;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .stars{color:var(--gold);font-size:10px;letter-spacing:-1px;flex:none}
  .tag{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-weight:600}
  .tag.econ{color:var(--accent)} .tag.earn{color:var(--accent2)} .tag.speak{color:var(--gold)}
  .tkr{font-size:10px;font-weight:800;color:var(--muted2);border:1px solid var(--border);border-radius:4px;padding:0 5px}

  /* 지표 예상/이전/실제 */
  .vals{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .vcell{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:4px 9px;min-width:62px}
  .vcell .k{font-size:9.5px;color:var(--muted2);font-weight:700}
  .vcell .v{font-size:12.5px;font-weight:800;margin-top:1px}
  .vcell.act .v{color:var(--gold)} .vcell.act{border-color:#4a3a12;background:#1c1607}
  .vcell.pending .v{color:var(--muted2)}
  .surprise{font-size:10.5px;color:var(--muted);margin-top:5px;font-weight:600}
  .surprise b.beat{color:#22c55e} .surprise b.miss{color:var(--down)} .surprise b.meet{color:var(--muted)}

  /* 실적 */
  .sess{font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px;flex:none}
  .sess.pre{color:#7dd3fc;border:1px solid #1e466b;background:#0a1c2e}
  .sess.post{color:var(--accent2);border:1px solid #3a2d63;background:#160f2c}
  .sess.tbd{color:var(--muted2);border:1px solid var(--border)}
  .sess.mk-kospi{color:#9ec5ff;border:1px solid #24405f;background:#0c1a2c}
  .sess.mk-kosdaq{color:#c4b5fd;border:1px solid #3a2d63;background:#150f2a}
  .tag.idx{color:var(--muted2)}
  .eps{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .epscell{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:4px 9px;min-width:74px}
  .epscell .k{font-size:9.5px;color:var(--muted2);font-weight:700}
  .epscell .v{font-size:12.5px;font-weight:800;margin-top:1px}
  .epscell.est .v{color:var(--accent)}
  .epscell.act{border-color:#4a3a12;background:#1c1607} .epscell.act .v{color:var(--gold)}
  body.light .epscell.act{border-color:#e6cf8f;background:#fbf3da}
  .growth{font-size:10.5px;font-weight:700;margin-top:5px}

  /* 분석 기사 링크 */
  .arts{margin-top:7px;display:flex;flex-direction:column;gap:3px}
  .art{font-size:11px;color:var(--accent2);font-weight:600;line-height:1.4;display:block}
  .art:hover{text-decoration:underline}
  .art .art-src{color:var(--muted2);font-weight:500;font-size:10px;margin-left:5px}

  .empty{padding:34px 16px;text-align:center;color:var(--muted2);font-size:13px;line-height:1.6}
  .offline{display:none;margin:0 0 16px;padding:10px 14px;border:1px dashed var(--border);border-radius:10px;color:var(--muted2);font-size:11.5px;background:#0c1424}

  footer{padding:22px;color:var(--muted2);font-size:11px;line-height:1.6;border-top:1px solid var(--border);margin-top:24px}
  footer b{color:var(--accent2)}

  @media(max-width:1100px){ .hirow{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:840px){ .cols{grid-template-columns:1fr} }
  /* ===== 페이지 전환 부드럽게: Cross-Document View Transitions(지원 브라우저). 미지원 시 일반 이동으로 무해 폴백 ===== */
  @view-transition{ navigation:auto; }
  ::view-transition-old(root){ animation:vt-out .14s ease both; }
  ::view-transition-new(root){ animation:vt-in .18s ease both; }
  @keyframes vt-out{ to{ opacity:0 } }
  @keyframes vt-in{ from{ opacity:0 } }
  header.topbar{ view-transition-name:topbar; }                 /* 상단바는 전환 내내 고정(깜빡임 방지) */
  ::view-transition-old(topbar),::view-transition-new(topbar){ animation:none; }
  @media (prefers-reduced-motion:reduce){ ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){ animation:none!important; } }
</style>
</head>

<main>
  <div class="offline" id="offline">⚠ 실시간 일정 데이터를 불러오지 못해 예시를 표시 중입니다. (로컬 서버 <b>대시보드-실행.bat</b> 또는 배포 환경에서 실시간 표시)</div>

      <div class="colhead"><h3>🇺🇸 미국</h3><span class="cnt" id="us-cnt"></span></div>
      <div class="feed" id="us-feed"></div>

<script>
/* ============================================================
   핵심 일정(경제지표·실적): data/calendar.json (fetch_calendar.py / 서버리스 calendar.js)
   · 미국: nasdaq.com 공개 캘린더. 지표 예상/이전/실제 + 실적 EPS 컨센서스(실시간)
   · 한국: nasdaq 한국 지표 + 한국은행/국가데이터처 공개 발표일정
   각 이벤트 필드: date(YYYY-MM-DD KST) time mk(kr|us) type(econ|earnings)
     econ:  title title_en importance(1~3) category forecast previous actual
     earnings: title ticker session eps_est eps_prev mktcap importance
   ============================================================ */
let EVENTS = [
  {date:'',time:'09:00',mk:'kr',type:'econ',title:'(예시) 소비자물가(CPI) (전년比)',importance:3,category:'지표',forecast:'2.5%',previous:'2.4%',actual:''},
  {date:'',time:'21:30',mk:'us',type:'econ',title:'(예시) 비농업 고용',title_en:'Nonfarm Payrolls',importance:3,category:'지표',forecast:'+18.5만',previous:'+17.7만',actual:''},
  {date:'',time:'',mk:'us',type:'earnings',title:'(예시) 엔비디아',ticker:'NVDA',session:'장 마감 후',eps_est:'1.12',eps_prev:'0.68',mktcap:'$3.2T',importance:3},
];
let TODAY = '';

const DOW=['일','월','화','수','목','금','토'];
const state={type:'all', imp:0, when:'all'};

function pad(n){return (n<10?'0':'')+n;}
function fmtClock(){try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hourCycle:'h23',weekday:'short',year:'2-digit',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);const wk=['일','월','화','수','목','금','토'][{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday]];document.getElementById('clock').textContent=o.year+'년 '+(+o.month)+'월 '+(+o.day)+'일('+wk+') '+o.hour+':'+o.minute+':'+o.second;}catch(e){}}
/* _updated(UTC) → 한국시간(KST) 표시. 오프셋 없으면 UTC로 간주. */
function kstUpd(iso, withDate){
  if(!iso) return '';
  const s=String(iso).replace(' ','T');
  const d=new Date(/[Zz]|[+\-]\d\d:?\d\d$/.test(s)?s:s+'Z');
  if(isNaN(d)) return s.replace('T',' ').slice(withDate?5:11,16);
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const g=t=>(p.find(x=>x.type===t)||{}).value||'';
  return (withDate?g('month')+'-'+g('day')+' ':'')+g('hour')+':'+g('minute');
}
function todayKST(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return p; // YYYY-MM-DD
}
function parseD(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function dayLabel(ds){
  const t=TODAY||todayKST();
  const d=parseD(ds), td=parseD(t);
  const diff=Math.round((d-td)/86400000);
  const md=(d.getMonth()+1)+'/'+d.getDate();
  let lab = diff===0?'오늘':diff===1?'내일':diff===2?'모레':diff===-1?'어제':md;
  return {lab, md, dow:DOW[d.getDay()], today:diff===0};
}
function num(s){const m=String(s==null?'':s).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):null;}

function match(e){
  if(state.type!=='all' && e.type!==state.type) return false;
  if(state.imp && (e.importance||0)<state.imp) return false;
  const t=TODAY||todayKST();
  if(state.when==='all') return true;     // 전체: 지난주~다음달(수집 윈도 그대로)
  if(state.when==='up') return e.date>=t;
  return e.date<t;
}

/* ── 이벤트 렌더 ── */
function starHTML(n){n=n||0;return n?`<span class="stars">${'★'.repeat(n)}</span>`:'';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function articlesHTML(e){
  if(!e.articles||!e.articles.length) return '';
  const links=e.articles.slice(0,2).map(a=>
    `<a class="art" href="${esc(a.u)}" target="_blank" rel="noopener" title="${esc(a.t)}">📰 ${esc(a.t)}${a.s?`<span class="art-src">${esc(a.s)}</span>`:''}</a>`
  ).join('');
  return `<div class="arts">${links}</div>`;
}

/* 실제 vs 예상 비교 → 화살표·색상 (예상 초과=▲빨강 / 미달=▼파랑 / 동일=■중립) */
function cmpMark(aStr, fStr){
  const a=num(aStr), f=num(fStr);
  if(a==null||f==null) return null;
  if(a>f) return {ar:'▲', c:'var(--up)'};
  if(a<f) return {ar:'▼', c:'var(--down)'};
  return {ar:'■', c:'var(--muted)'};
}
function epsMark(surprise, aStr, eStr){   // 실적: 서프라이즈 부호 우선, 없으면 실제vs예상 숫자비교
  const v=(surprise!=null && surprise!=='') ? parseFloat(String(surprise).replace(/[+%\s]/g,'')) : NaN;
  if(!isNaN(v)) return v>0?{ar:'▲',c:'var(--up)'}:v<0?{ar:'▼',c:'var(--down)'}:{ar:'■',c:'var(--muted)'};
  return cmpMark(aStr, eStr);
}
function actSpan(valStr, mk){   // 실제값 렌더(화살표+색상). mk 없으면 골드(비교불가)
  if(!valStr) return '발표 전';
  return mk ? `<span style="color:${mk.c}">${mk.ar} ${valStr}</span>` : valStr;
}

function econHTML(e){
  const hasA=!!e.actual;
  const mk = hasA ? cmpMark(e.actual, e.forecast) : null;
  let surprise='';
  if(hasA && mk){
    const txt = mk.ar==='▲'?'예상 상회':mk.ar==='▼'?'예상 하회':'예상 부합';
    surprise=`<div class="surprise">예상 대비 <b style="color:${mk.c}">${mk.ar} ${txt}</b></div>`;
  }
  const cat = e.category==='연설'?'<span class="tag speak">연설</span>':'<span class="tag econ">지표</span>';
  const done = hasA?'<span class="tag" style="color:var(--gold);border-color:#4a3a12">발표완료</span>':'';
  return `<div class="ev">
    <div class="tm">${e.time||'미정'}${e.et?`<small>현지 ${e.et} ET</small>`:''}</div>
    <div class="bd">
      <div class="ti">${starHTML(e.importance)}<span>${e.title}</span>${cat}${done}</div>
      ${e.category==='연설'?'':`<div class="vals">
        <div class="vcell"><div class="k">이전</div><div class="v">${e.previous||'-'}</div></div>
        <div class="vcell"><div class="k">예상</div><div class="v">${e.forecast||'-'}</div></div>
        <div class="vcell ${hasA?'act':'pending'}"><div class="k">실제</div><div class="v">${actSpan(e.actual, mk)}</div></div>
      </div>`}
      ${surprise}
      ${articlesHTML(e)}
    </div>
  </div>`;
}

function earnHTML(e){
  const isKR = e.mk==='kr';
  const mkt = (e.market||'').toUpperCase();
  const badge = isKR
    ? `<span class="sess ${mkt==='KOSDAQ'?'mk-kosdaq':'mk-kospi'}">${mkt||'KR'}</span>`
    : `<span class="sess ${/시작 전|장전|pre/i.test(e.session)?'pre':/마감 후|장후|post/i.test(e.session)?'post':'tbd'}">${e.session||'시간 미정'}</span>`;
  const hasA=!!e.eps_actual;
  const mk = hasA ? epsMark(e.surprise, e.eps_actual, e.eps_est) : null;
  const est=num(e.eps_est), prev=num(e.eps_prev);
  let growth='';
  if(hasA && e.surprise){                 // 발표 후: 예상 대비 서프라이즈
    const beat=!/^-/.test(e.surprise);
    growth=`<div class="growth" style="color:${beat?'var(--up)':'var(--down)'}">예상 대비 서프라이즈 ${beat?'▲':'▼'} ${e.surprise.replace(/[+\-]/,'')}</div>`;
  } else if(est!=null && prev!=null && prev!==0){   // 발표 전: 컨센서스 전년比
    const g=(est-prev)/Math.abs(prev)*100, up=g>=0;
    growth=`<div class="growth" style="color:${up?'var(--up)':'var(--down)'}">EPS 컨센서스 전년比 ${up?'▲':'▼'} ${Math.abs(g).toFixed(0)}%</div>`;
  }
  const idxTag = (!isKR && e.index)?`<span class="tag idx">${e.index}</span>`:'';
  const capTag = e.mktcap?`<span class="tag earn">${e.mktcap}</span>`:'';
  const done = hasA?'<span class="tag" style="color:var(--gold);border-color:#4a3a12">발표완료</span>':'';
  const prevCell = e.eps_prev?`<div class="epscell"><div class="k">전년 동기</div><div class="v">${e.eps_prev}</div></div>`:'';
  const actCell = hasA?`<div class="epscell act"><div class="k">실제 EPS</div><div class="v">${mk?`<span style="color:${mk.c}">${mk.ar} ${e.eps_actual}</span>`:e.eps_actual}</div></div>`:'';
  return `<div class="ev">
    <div class="tm" style="width:auto;min-width:46px">${badge}</div>
    <div class="bd">
      <div class="ti">${starHTML(e.importance)}<span>${e.title}</span>${e.ticker?`<span class="tkr">${e.ticker}</span>`:''}${idxTag}${capTag}${done}</div>
      <div class="eps">
        ${prevCell}
        <div class="epscell est"><div class="k">EPS 예상</div><div class="v">${e.eps_est||'-'}</div></div>
        ${actCell}
        ${e.n_ests?`<div class="epscell"><div class="k">추정기관</div><div class="v">${e.n_ests}곳</div></div>`:''}
      </div>
      ${growth}
      ${articlesHTML(e)}
    </div>
  </div>`;
}

function feedHTML(mk){
  const list=EVENTS.filter(e=>e.mk===mk && match(e)).sort((a,b)=>
    (a.date+ (a.time||'99:99')).localeCompare(b.date+(b.time||'99:99')));
  if(!list.length){ const w=state.when==='up'?'다가오는':state.when==='past'?'발표된':'표시할'; return {n:0, html:`<div class="empty">${w} ${mk==='kr'?'한국':'미국'} 일정이 없습니다.<br><span style="font-size:11px">필터(유형·중요도)를 조정해 보세요.</span></div>`}; }
  const byDay={};
  list.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  const days=Object.keys(byDay).sort((a,b)=>state.when==='past'?b.localeCompare(a):a.localeCompare(b));
  const html=days.map(ds=>{
    const dl=dayLabel(ds);
    const rows=byDay[ds].map(e=>e.type==='earnings'?earnHTML(e):econHTML(e)).join('');
    return `<div class="daygrp">
      <div class="dayhd ${dl.today?'today':''}" data-d="${ds}">${dl.lab} <span class="dow">${dl.md}(${dl.dow})</span><span class="n">${byDay[ds].length}건</span></div>
      ${rows}</div>`;
  }).join('');
  return {n:list.length, html};
}

const PRIO=['비농업 고용','소비자물가','생산자물가','기준금리','개인소비지출','PCE','ISM','소매판매','국내총생산','실업률'];
function collapseEcon(list){   // 같은 일시의 한 발표(예: 고용지표 묶음) → 대표 1건
  const rank=e=>{let b=PRIO.findIndex(k=>e.title.includes(k)); if(b<0)b=PRIO.length; return b+(/민간|광의|특수|제외|근원/.test(e.title)?0.4:0);};
  const g={};
  list.forEach(e=>{const k=e.date+'|'+e.time;(g[k]=g[k]||[]).push(e);});
  return Object.keys(g).map(k=>g[k].slice().sort((a,b)=>rank(a)-rank(b)||(b.importance-a.importance)||a.title.length-b.title.length)[0]);
}
function addD(ds,n){const[a,b,c]=ds.split('-').map(Number);const d=new Date(a,b-1,c+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function highlights(){   // 지난주~이번주(±7일) 최상위 지표·대형 실적. 발표된 것은 실제값으로
  const t=TODAY||todayKST();
  const lo=addD(t,-7), hi=addD(t,7), inWin=e=>e.date>=lo&&e.date<=hi;
  const econ=collapseEcon(EVENTS.filter(e=>inWin(e)&&e.type==='econ'&&e.importance>=3&&e.category!=='연설'));
  const earn=EVENTS.filter(e=>inWin(e)&&e.type==='earnings'&&e.importance>=3);
  const prox=e=>Math.abs(Math.round((parseD(e.date)-parseD(t))/86400000));   // 오늘 근접 우선
  const all=econ.concat(earn).sort((a,b)=>prox(a)-prox(b) || (a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')));
  const top=all.slice(0,4).sort((a,b)=>(a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')));
  if(!top.length){ document.getElementById('hirow').innerHTML='<div class="empty" style="grid-column:1/-1">표시할 주요 지표·실적이 없습니다.</div>'; return; }
  document.getElementById('hirow').innerHTML=top.map(e=>{
    const dl=dayLabel(e.date);
    const flag=e.mk==='kr'?'🇰🇷 한국':'🇺🇸 미국';
    let det, done='';
    if(e.type==='earnings'){
      if(e.eps_actual){ const mk=epsMark(e.surprise,e.eps_actual,e.eps_est); det=`${e.ticker?e.ticker+' · ':''}예상 ${e.eps_est||'-'} · 실제 <b style="color:${mk?mk.c:'var(--gold)'}">${mk?mk.ar+' ':''}${e.eps_actual}</b>${e.surprise?` (${e.surprise})`:''}`; done='발표완료'; }
      else det=`${e.ticker?e.ticker+' · ':''}${e.session||''} · EPS 예상 ${e.eps_est||'-'}`;
    } else {
      if(e.actual){ const mk=cmpMark(e.actual,e.forecast); det=`이전 ${e.previous||'-'} · 예상 ${e.forecast||'-'} · 실제 <b style="color:${mk?mk.c:'var(--gold)'}">${mk?mk.ar+' ':''}${e.actual}</b>`; done='발표완료'; }
      else det=`이전 ${e.previous||'-'} · 예상 ${e.forecast||'-'}`;
    }
    return `<div class="hicard ${e.mk}">
      <div class="when">${dl.lab} ${dl.md}(${dl.dow}) ${e.time?'· '+e.time:''}${done?` · <span style="color:var(--gold);font-weight:800">${done}</span>`:''}</div>
      <h4>${e.title}</h4>
      <div class="det">${det}</div>
      <div class="flag" style="margin-top:7px">${flag} · ${e.type==='earnings'?'실적':'경제지표'}</div>
    </div>`;
  }).join('');
}

let _scrolledToday=false;
/* 첫 데이터 로드 후 한 번, 양쪽 피드를 오늘 날짜로 스크롤(기본 위치=오늘) */
function scrollToToday(){
  if(_scrolledToday) return;
  const today=TODAY||'';
  let done=false;
  ['kr-feed','us-feed'].forEach(id=>{
    const feed=document.getElementById(id); if(!feed) return;
    let td=feed.querySelector('.dayhd.today');
    if(!td && today){   // 오늘 일정이 없는 시장은 '오늘 이후 첫 날'로
      const hds=feed.querySelectorAll('.dayhd[data-d]');
      for(let i=0;i<hds.length;i++){ if(hds[i].dataset.d>=today){ td=hds[i]; break; } }
    }
    if(!td) return;
    feed.scrollTop += td.getBoundingClientRect().top - feed.getBoundingClientRect().top;
    done=true;
  });
  if(done) _scrolledToday=true;
}
function renderAll(){
  const kr=feedHTML('kr'), us=feedHTML('us');
  const kf=document.getElementById('kr-feed'), uf=document.getElementById('us-feed');
  const ksc=kf?kf.scrollTop:0, usc=uf?uf.scrollTop:0;   // 재렌더 시 스크롤 위치 보존(자동 갱신·필터 시 튐 방지)
  kf.innerHTML=kr.html; uf.innerHTML=us.html;
  kf.scrollTop=ksc; uf.scrollTop=usc;
  document.getElementById('kr-cnt').textContent=kr.n+'건';
  document.getElementById('us-cnt').textContent=us.n+'건';
  highlights();
}

/* 필터 바인딩 */
function bindSeg(id, key, cast){
  document.querySelectorAll('#'+id+' button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state[key]=cast(b.dataset[Object.keys(b.dataset)[0]]); renderAll();
  }));
}
bindSeg('type-seg','type',v=>v);
bindSeg('imp-seg','imp',v=>+v);
bindSeg('when-seg','when',v=>v);

document.getElementById('disc').textContent = '데이터: nasdaq.com 공개 캘린더 · 한국은행·국가데이터처·관세청 발표일정. 모든 시각은 한국시간(KST)이고 약 5분마다 갱신합니다. 정보 제공 목적이며 투자 권유가 아닙니다.';

/* 스냅샷(data/calendar.json · ±30일·기사 링크 포함)을 '넓은 기준'으로 삼고,
   서버리스(/api/calendar · 30분)의 갓 발표된 실제값을 그 위에 패치한다.
   → 완전성(±30·기사)과 신선도(방금 나온 실제 수치)를 동시에 확보. */
function evKey(e){
  return e.type==='earnings'
    ? 'e|'+e.mk+'|'+e.date+'|'+(e.ticker||e.title)
    : 'c|'+e.mk+'|'+e.date+'|'+(e.time||'')+'|'+e.title;
}
/* 직전 일정을 브라우저에 보관(대시보드와 키 공유) → 페이지 진입 시 즉시 표시(빈 화면·예시 깜빡임 방지) */
const CAL_LS='alphadesk.calcache';
function lsRead(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsWrite(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function seedCalFromCache(){ const c=lsRead(CAL_LS); if(c && Array.isArray(c.events) && c.events.length){ EVENTS=c.events; TODAY=todayKST(); } }
async function loadCalendar(){
  let live=null, snap=null;
  try{ const r=await fetch('/api/calendar',{cache:'default'}); if(r.ok) live=await r.json(); }catch(e){}
  try{ const r=await fetch('data/calendar.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) snap=await r.json(); }catch(e){}
  const base=(snap && snap.events && snap.events.length) ? snap : live;   // 스냅샷 우선(넓은 윈도·기사)
  if(!base || !base.events || !base.events.length){ document.getElementById('offline').style.display='block'; return; }
  let events=base.events.slice();
  if(live && live.events && live.events.length){
    const idx={}; events.forEach((e,i)=>{ idx[evKey(e)]=i; });
    live.events.forEach(le=>{
      const i=idx[evKey(le)];
      if(i!=null){   // 갓 발표된 실제값을 패치
        const e=events[i];
        if(le.actual && le.actual!==e.actual) e.actual=le.actual;
        if(le.eps_actual && le.eps_actual!==e.eps_actual){ e.eps_actual=le.eps_actual; if(le.surprise) e.surprise=le.surprise; }
      } else { events.push(le); idx[evKey(le)]=events.length-1; }   // 스냅샷에 아직 없는 신규 이벤트
    });
  }
  EVENTS=events; TODAY=todayKST();   // '오늘'은 항상 KST 현재 날짜. 스냅샷 생성 시점(UTC) 날짜는 쓰지 않는다
  lsWrite(CAL_LS, {events:events, today:TODAY});   // 직전 일정 보관(다음 진입 즉시 시드)
  document.getElementById('offline').style.display='none';
  renderAll();
  scrollToToday();
  const fresh=(live&&live._updated)?live:base;
  const u=document.getElementById('upd'); if(u) u.textContent='● '+kstUpd(fresh._updated,true)+' 갱신';
}

function setThemeClass(mode){var light=mode==='light';document.body.classList.toggle('light',light);var b=document.getElementById('themeToggle');if(b)b.textContent=light?'☀️ 라이트':'🌙 다크';}
(function(){var t=document.getElementById('themeToggle');if(t)t.addEventListener('click',function(){var m=document.body.classList.contains('light')?'dark':'light';setThemeClass(m);try{localStorage.setItem('alphadesk.theme',m)}catch(e){}});setThemeClass(localStorage.getItem('alphadesk.theme')||'dark');})();
TODAY=todayKST(); seedCalFromCache();   // 직전 일정을 즉시 시드(첫 화면 빈/예시 방지)
renderAll(); fmtClock(); loadCalendar();
setInterval(fmtClock,1000); setInterval(loadCalendar,300000);
</script>
