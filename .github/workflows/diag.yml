name: diag (수동 진단)

# 외부 데이터 소스 진단용 — 수동 실행 전용, 자동 트리거 없음.
# 네이버 시장지표·폴링 API 를 시간차 샘플링해 실시간 반영 여부를 확인한다.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 목표·손절 배포 확인 (임시)
        run: |
          s=$(curl -sL "https://sunny-invest-dashboard.pages.dev/signals")
          echo "목표손절 헤더: $(echo "$s" | grep -c '목표·손절')"
          echo "planFor 함수: $(echo "$s" | grep -c 'function planFor')"
          echo "atrLast 함수: $(echo "$s" | grep -c 'function atrLast')"

      - name: 러셀2000 목록 소스 3차 프로브 (임시)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          echo "== ① iShares IWM 제품 페이지에서 실제 CSV 링크 추출"
          curl -sL "https://www.ishares.com/us/products/239710/ishares-russell-2000-etf" -H "User-Agent: $UA" \
            | grep -o '[^"]*\.ajax?fileType=csv[^"]*' | head -3
          echo "== ② Vanguard VTWO 보유종목 API"
          curl -s "https://investor.vanguard.com/investment-products/etfs/profile/api/VTWO/portfolio-holding/stock" \
            -H "User-Agent: $UA" -H "Accept: application/json" | head -c 400; echo
          echo "== ③ stockanalysis.com 러셀2000 리스트"
          curl -s "https://stockanalysis.com/list/russell-2000-stocks/" -H "User-Agent: $UA" | python3 -c "
          import re,sys
          h=sys.stdin.read()
          print('HTML길이', len(h))
          m=re.findall(r'\"s\":\"([A-Z.\-]{1,6})\",\"n\":\"([^\"]+)\"', h)
          print('심볼·이름 파싱:', len(m), '| 앞5:', m[:5])
          mc=re.findall(r'\"marketCap\":([0-9.e+]+)', h)
          print('marketCap 필드:', len(mc), '| 앞3:', mc[:3])"
          echo "== ③b stockanalysis 내부 API"
          curl -s "https://api.stockanalysis.com/api/screener/s/f?m=marketCap&s=desc&c=s,n,marketCap&i=russell2000" \
            -H "User-Agent: $UA" | head -c 500; echo

      - name: 핀비즈 러셀2000 스크리너 프로브 (임시)
        run: |
          echo "== finviz screener f=idx_rut 시총 내림차순 1페이지"
          curl -s "https://finviz.com/screener.ashx?v=111&f=idx_rut&o=-marketcap&r=1" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            -H "Referer: https://finviz.com/" | python3 -c "
          import re,sys
          h=sys.stdin.read()
          rows=re.findall(r'quote\.ashx\?t=([A-Z.\-]+)\&', h)
          total=re.search(r'#1 / (\d+) Total', h) or re.search(r'Total: \D*(\d+)', h)
          print('HTML길이', len(h), '| 티커수(중복포함)', len(rows), '| 앞10:', list(dict.fromkeys(rows))[:10])
          print('총 종목 표기:', total.group(1) if total else '(패턴 미발견)')
          print('MarketCap 열 존재:', 'Market Cap' in h)"
          echo "== 501번째부터 (r=501) — 페이징 확인"
          curl -s "https://finviz.com/screener.ashx?v=111&f=idx_rut&o=-marketcap&r=501" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            -H "Referer: https://finviz.com/" | python3 -c "
          import re,sys
          h=sys.stdin.read()
          rows=list(dict.fromkeys(re.findall(r'quote\.ashx\?t=([A-Z.\-]+)\&', h)))
          print('r=501 티커 앞5:', rows[:5])"
          echo "== 네이버 폴링: 소형주 한글명·전일비 필드"
          curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
            "https://polling.finance.naver.com/api/realtime/worldstock/stock/RGTI.O,SOUN.O" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for s in (d.get('datas') or []):
              print(s.get('reutersCode'), '|', s.get('stockName'), '|', s.get('closePrice'), s.get('compareToPreviousClosePrice'), s.get('fluctuationsRatio'), (s.get('compareToPreviousPrice') or {}).get('code'), '| over:', bool(s.get('overMarketPriceInfo')))"

      - name: 러셀2000 대안 소스 프로브 (임시)
        run: |
          echo "== iShares IWM holdings CSV (러셀2000 구성 원천)"
          curl -sL "https://www.ishares.com/us/products/239710/ishares-russell-2000-etf/1467271812596.ajax?fileType=csv&fileName=IWM_holdings&dataType=fund" \
            -H "User-Agent: Mozilla/5.0" | head -c 900; echo; echo "---"
          echo "== 네이버 worldstock 폴링 다중 종목 (3개)"
          curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
            "https://polling.finance.naver.com/api/realtime/worldstock/stock/AAPL.O,MSFT.O,IONQ.N" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin); st=d.get('datas') or []
              print('datas:', len(st))
              for s in st[:3]: print('  ', s.get('reutersCode'), s.get('closePrice'), s.get('fluctuationsRatio'), (s.get('compareToPreviousPrice') or {}).get('code'), s.get('stockName'))
          except Exception as e: print('ERR', e)"
          echo "== 다중 종목 한도 (같은 코드 40개 반복)"
          codes=$(python3 -c "print(','.join(['AAPL.O','MSFT.O','NVDA.O','TSLA.O','AMZN.O','GOOGL.O','META.O','AVGO.O']*5))")
          curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
            "https://polling.finance.naver.com/api/realtime/worldstock/stock/$codes" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin); print('40코드 요청 → datas:', len(d.get('datas') or []))
          except Exception as e: print('ERR', e)"
          echo "== 러셀 소형주 실시세 확인 (IONQ.N 등 임의 소형주)"
          curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
            "https://polling.finance.naver.com/api/realtime/worldstock/stock/RGTI.O,APLD.O,SOUN.O" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin); st=d.get('datas') or []
              print('소형주 datas:', len(st))
              for s in st: print('  ', s.get('reutersCode'), s.get('closePrice'), s.get('marketValue'))
          except Exception as e: print('ERR', e)"

      - name: 러셀2000 네이버 소스 프로브 (임시)
        run: |
          H='-H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/"'
          for idx in ".RUT" "RUT" ".RUA"; do
            echo "== index/$idx/enrollStocks p1"
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
              "https://api.stock.naver.com/index/$idx/enrollStocks?page=1&pageSize=100" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              st=d.get('stocks') or []
              tp=d.get('totalCount') or d.get('total') or '?'
              print('total=%s page1=%d' % (tp, len(st)))
              for s in st[:3]:
                  print('  ', s.get('symbolCode'), s.get('stockName'), s.get('marketValue'), (s.get('stockExchangeType') or {}).get('code'))
              caps=[float(s.get('marketValueRaw') or 0) for s in st[:20]]
              print('  cap 정렬 확인(앞20):', 'DESC' if caps==sorted(caps,reverse=True) else caps[:5])
          except Exception as e: print('ERR', e, sys.stdin.read()[:120] if not sys.stdin.closed else '')"
          done
          echo "== index/.RUT/enrollStocks p5·p6 (500위권 존재 확인)"
          for p in 5 6; do
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
              "https://api.stock.naver.com/index/.RUT/enrollStocks?page=$p&pageSize=100" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin); st=d.get('stocks') or []
              print('p$p:', len(st), '건', (st[0].get('symbolCode') if st else ''))
          except Exception as e: print('p$p ERR', e)"
          done

      - name: 시간차 샘플링 (3회 × 35초)
        run: |
          sample() {
            echo "---- sample $1 @ $(date -u +%H:%M:%S) ----"
            # productDetail: 시간 필드 포함 앞부분을 그대로 출력 (어떤 timestamp 필드가 있는지 확인)
            for pair in "bond US10YT=RR" "bond US2YT=RR" "exchange FX_USDKRW" "metals GCcv1" "energy CLcv1"; do
              set -- $pair
              body=$(curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
                "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=$1&reutersCode=$2")
              echo "[$1/$2] $(echo "$body" | python3 -c "
          import json,sys
          try:
              v=json.load(sys.stdin).get('result') or {}
              keys=[k for k in v.keys() if 'ime' in k or 'ate' in k or 'At' in k]
              print('close=%s chg=%s pct=%s | 시간필드: %s' % (v.get('closePrice'), v.get('compareToPreviousClosePrice'), v.get('fluctuationsRatio'), {k:v.get(k) for k in keys}))
          except Exception as e: print('ERR', e)")"
            done
            # 폴링 선물 (NQcv1)
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
              "https://polling.finance.naver.com/api/realtime/worldstock/futures/NQcv1" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); r=(d.get('datas') or [{}])[0]
          print('[NQcv1 polling] close=%s chg=%s dir=%s time=%s' % (r.get('closePrice'), r.get('compareToPreviousClosePrice'), (r.get('compareToPreviousPrice') or {}).get('text'), d.get('time')))"
            # 운영 API
            curl -s "https://sunny-invest-dashboard.pages.dev/api/market" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          row=lambda k: '%s=%s(%s)' % (k, (d.get(k) or {}).get('price'), (d.get(k) or {}).get('src'))
          print('[운영API]', ' '.join(row(k) for k in ('usdkrw','gold','wti','ndxfut','ust10y','ust2y')), '_updated=%s' % d.get('_updated'))"
            echo
          }
          sample 1; sleep 35; sample 2; sleep 35; sample 3

      - name: 폴링 marketindex 실시간 후보 (지연 없는 대안 탐색)
        run: |
          for u in "https://polling.finance.naver.com/api/realtime/marketindex/exchange/FX_USDKRW" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/bond/US10YT%3DRR" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/metals/GCcv1" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/energy/CLcv1" \
                   "https://polling.finance.naver.com/api/realtime/worldstock/futures/GCcv1" \
                   "https://polling.finance.naver.com/api/realtime/worldstock/futures/CLcv1"; do
            echo "== $u"
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "$u" | head -c 400; echo
          done
