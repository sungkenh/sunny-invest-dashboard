name: diag (수동 진단)
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 코스피야간(EWY)·WTI 소스 진단
        run: |
          echo "== 운영 /api/market (ewy·wti·gold·ndxfut)"
          curl -sL "https://sunny-invest-dashboard.pages.dev/api/market" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for k in ('ewy','wti','gold','ndxfut','kospi'):
              q=d.get(k) or {}
              print(f'{k:8s}', 'price:',q.get('price'), '| chg:',q.get('chg'), '| src:',q.get('src'), '| err:',q.get('error'), '| sp:',len(q.get('sp') or []))
          print('_updated:', d.get('_updated'))"
          echo "== 네이버 폴링 CLcv1 (WTI 10분지연 후보)"
          curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "https://polling.finance.naver.com/api/realtime/marketindex/energy/CLcv1" | head -c 300; echo
          echo "== 네이버 폴링 worldstock/futures/CLcv1"
          curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "https://polling.finance.naver.com/api/realtime/worldstock/futures/CLcv1" | head -c 300; echo
          echo "== 야후 CL=F (러너 직접)"
          curl -sL -H "User-Agent: Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/CL%3DF?interval=5m&range=1d" | python3 -c "
          import json,sys
          m=json.load(sys.stdin)['chart']['result'][0]['meta']
          print('CL=F', m.get('regularMarketPrice'), 'time', m.get('regularMarketTime'))"
          echo "== 야후 EWY (러너 직접 — pre/post 포함 확인)"
          curl -sL -H "User-Agent: Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/EWY?interval=5m&range=1d&includePrePost=true" | python3 -c "
          import json,sys
          m=json.load(sys.stdin)['chart']['result'][0]['meta']
          print('EWY', m.get('regularMarketPrice'), '| pre/post keys:', [k for k in m.keys() if 'ost' in k or 'reMarket' in k])"
          echo "== 네이버 해외 EWY 폴링 후보"
          for u in "https://polling.finance.naver.com/api/realtime/worldstock/stock/EWY" "https://polling.finance.naver.com/api/realtime/worldstock/stock/EWY.P" "https://api.stock.naver.com/stock/EWY.P/basic"; do
            echo "-- $u"; curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "$u" | head -c 260; echo
          done
