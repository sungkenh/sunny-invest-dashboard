name: diag (수동 진단)
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 공시 소스 2차 프로브
        run: |
          for u in \
            "https://m.stock.naver.com/api/stock/005930/announcement?pageSize=10&page=1" \
            "https://m.stock.naver.com/api/news/notice/005930?pageSize=10&page=1" \
            "https://m.stock.naver.com/api/news/stock/005930?pageSize=3&page=1" \
            "https://api.stock.naver.com/stock/005930/announcement?pageSize=10"; do
            echo "== $u"
            curl -s --max-time 15 -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "$u" | head -c 400; echo; echo
          done
          echo "== finance.naver news_notice HTML"
          curl -s --max-time 15 -H "User-Agent: Mozilla/5.0" "https://finance.naver.com/item/news_notice.naver?code=005930&page=1" | iconv -f euc-kr -t utf-8 2>/dev/null | grep -o '<a[^>]*>[^<]\{6,60\}</a>' | head -8
          echo "== DART 기업별 RSS"
          curl -s --max-time 15 "https://dart.fss.or.kr/api/todayRSS.xml" | head -c 300; echo
