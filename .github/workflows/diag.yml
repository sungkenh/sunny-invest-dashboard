name: diag (수동 진단)

# 배포 검증용 임시 프로브 — 단타(분봉) 전략 제거(#61)
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 단타 제거 배포 확인
        run: |
          B="https://sunny-invest-dashboard.pages.dev"
          for i in $(seq 1 12); do
            curl -sL "$B/signals" > /tmp/s.html
            if ! grep -q '단타' /tmp/s.html; then echo "배포 확인 (try $i)"; break; fi
            echo "  try $i: 아직 이전 버전"; sleep 30
          done
          curl -sL "$B/plan" > /tmp/p.html
          bad=0
          echo "== 제거 확인"
          for m in "단타" 'data-v="day"' 'id="seg-itv"' 'id="fl-itv"' "DAY_RANGE" "MODE==='day'" "'15m'"; do
            if grep -qF "$m" /tmp/s.html; then echo "  ! 아직 남아있음: $m"; bad=1; else echo "  제거됨: $m"; fi
          done
          echo "== 유지 확인"
          for m in 'data-v="swing"' 'data-v="long"' 'id="seg-sitv"' 'data-v="120m"' "SW_RANGE='3mo'" "agg120" "BT_H={swing:30,long:20}"; do
            if grep -qF "$m" /tmp/s.html; then echo "  있음: $m"; else echo "  ! 없음: $m"; bad=1; fi
          done
          echo "== 전략 버튼이 2개인지"
          python3 - /tmp/s.html <<'PY'
          import re, sys
          t = open(sys.argv[1], encoding='utf-8').read()
          seg = t.split('id="seg-mode"')[1].split('</div>')[0]
          vs = re.findall(r'data-v="([^"]+)"', seg)
          print('  seg-mode:', vs)
          sys.exit(0 if vs == ['swing', 'long'] else 1)
          PY
          echo "== 플래너 BT 블록이 시그널과 바이트 동일한지"
          python3 - /tmp/s.html /tmp/p.html <<'PY'
          import sys
          def grab(p, n):
              t = open(p, encoding='utf-8').read()
              return t.split('/*%s-BEGIN*/' % n)[1].split('/*%s-END*/' % n)[0]
          for n in ('IND', 'BT', 'RES'):
              a, b = grab(sys.argv[1], n), grab(sys.argv[2], n)
              print('  %s: %d / %d — %s' % (n, len(a), len(b), '동일' if a == b else '불일치 !'))
              if a != b: sys.exit(1)
          PY
          if [ "$bad" = "0" ]; then echo "PROBE-OK"; else echo "PROBE-FAIL"; exit 1; fi
