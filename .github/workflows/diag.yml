name: diag (수동 진단)
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 네이버 종목 공시 API 후보 프로브
        run: |
          H='-H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/"'
          for u in \
            "https://m.stock.naver.com/api/stock/005930/notice?pageSize=10&page=1" \
            "https://m.stock.naver.com/front-api/stock/notice?code=005930&pageSize=10" \
            "https://m.stock.naver.com/api/stocks/notice/005930?pageSize=10" \
            "https://api.stock.naver.com/notice/domestic/005930?pageSize=10" \
            "https://m.stock.naver.com/front-api/news/notice?code=005930"; do
            echo "== $u"
            curl -s --max-time 15 -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "$u" | head -c 500; echo; echo
          done
