name: diag (수동 진단)

# 외부 데이터 소스 진단용 — 수동 실행 전용, 자동 트리거 없음.
# 네이버 시장지표·폴링 API 를 시간차 샘플링해 실시간 반영 여부를 확인한다.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 토스 llms.txt 문서 프로브 (임시)
        run: |
          UA='User-Agent: Mozilla/5.0'
          B='https://developers.tossinvest.com'
          echo "== llms.txt"
          curl -s -H "$UA" "$B/llms.txt" | head -120
          echo
          echo "== 관련 문서(md) 수집: 인증·시장지표·투자자·캘린더"
          curl -s -H "$UA" "$B/llms.txt" | grep -oE 'https?://[^ )]+|/[a-zA-Z0-9/._-]+\.md' | sort -u > /tmp/urls.txt || true
          cat /tmp/urls.txt | head -40
          for u in $(grep -iE 'auth|token|indicator|investor|calendar|market' /tmp/urls.txt | head -12); do
            case "$u" in http*) full="$u";; *) full="$B$u";; esac
            echo "===== $full"
            curl -s -H "$UA" "$full" | head -c 3500; echo
          done

      - name: 토스 Open API 스펙 프로브 (임시)
        run: |
          UA='User-Agent: Mozilla/5.0'
          echo "== 문서 페이지에서 스펙 URL 탐색"
          curl -s -H "$UA" "https://developers.tossinvest.com/docs/market-indicators" -o /tmp/doc.html || true
          echo " HTML 크기: $(wc -c < /tmp/doc.html)"
          grep -oE '"[^"]*\.(json|yaml|yml)"|/openapi[^"]*|/swagger[^"]*|/api-docs[^"]*' /tmp/doc.html | sort -u | head -20 || true
          grep -oE 'src="[^"]*"|href="[^"]*"' /tmp/doc.html | sort -u | head -30 || true
          echo "== 스펙 후보 직접 시도"
          for u in "https://developers.tossinvest.com/openapi.json" \
                   "https://developers.tossinvest.com/docs/openapi.json" \
                   "https://developers.tossinvest.com/api-docs" \
                   "https://developers.tossinvest.com/openapi.yaml" \
                   "https://openapi.tossinvest.com/openapi.json" \
                   "https://developers.tossinvest.com/spec.json"; do
            printf '%s → ' "$u"
            code=$(curl -s -o /tmp/spec -w '%{http_code}' -H "$UA" "$u")
            echo "$code ($(wc -c < /tmp/spec) bytes) $(head -c 120 /tmp/spec | tr -d '\n')"
            if [ "$code" = "200" ] && head -c 1 /tmp/spec | grep -q '{'; then cp /tmp/spec /tmp/spec.json; fi
          done
          if [ -f /tmp/spec.json ]; then
            echo "== 스펙 파싱: 토큰·시장지표·수급·캘린더 경로"
            python3 - <<'EOF'
          import json
          d=json.load(open('/tmp/spec.json'))
          print('title:', (d.get('info') or {}).get('title'), '| servers:', d.get('servers'))
          for p,ops in (d.get('paths') or {}).items():
              for m,op in ops.items():
                  if not isinstance(op,dict): continue
                  tags=op.get('tags') or []
                  t=' '.join(tags)+' '+str(op.get('summary',''))+' '+p
                  if any(k in t.lower() for k in ('token','oauth','auth','indicator','investor','calendar','market','index','수급','지표','캘린더','투자자')):
                      print(m.upper(), p, '|', tags, '|', op.get('summary'))
          EOF
            echo "== 수급·캘린더 응답 스키마 상세"
            python3 - <<'EOF'
          import json
          d=json.load(open('/tmp/spec.json'))
          def resolve(s,depth=0):
              if depth>4 or not isinstance(s,dict): return s
              if '$ref' in s:
                  node=d
                  for part in s['$ref'].lstrip('#/').split('/'): node=node.get(part,{})
                  return resolve(node,depth+1)
              return s
          for p,ops in (d.get('paths') or {}).items():
              low=p.lower()
              if any(k in low for k in ('investor','calendar','indicator')):
                  for m,op in ops.items():
                      if not isinstance(op,dict): continue
                      print('===',m.upper(),p)
                      print(' params:', [ (q.get('name'),q.get('in'),(q.get('schema') or {}).get('type')) for q in (op.get('parameters') or []) ])
                      try:
                          sch=resolve(op['responses']['200']['content']['application/json']['schema'])
                          print(' 응답 스키마:', json.dumps(sch, ensure_ascii=False)[:1200])
                      except Exception as e: print(' 스키마 추출 실패', e)
          EOF
          fi

      - name: 시간차 샘플링 (3회 × 35초)
        run: |
          sample() {
            echo "---- sample $1 @ $(date -u +%H:%M:%S) ----"
            # productDetail: 시간 필드 포함 앞부분을 그대로 출력 (어떤 timestamp 필드가 있는지 확인)
            for pair in "bond US10YT=RR" "bond US2YT=RR" "exchange FX_USDKRW" "metals GCcv1" "energy CLcv1"; do
              set -- $pair
              body=$(curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
                "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=$1&reutersCode=$2")
              echo "[$1/$2] $(echo "$body" | python3 -c "
          import json,sys
          try:
              v=json.load(sys.stdin).get('result') or {}
              keys=[k for k in v.keys() if 'ime' in k or 'ate' in k or 'At' in k]
              print('close=%s chg=%s pct=%s | 시간필드: %s' % (v.get('closePrice'), v.get('compareToPreviousClosePrice'), v.get('fluctuationsRatio'), {k:v.get(k) for k in keys}))
          except Exception as e: print('ERR', e)")"
            done
            # 폴링 선물 (NQcv1)
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
              "https://polling.finance.naver.com/api/realtime/worldstock/futures/NQcv1" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); r=(d.get('datas') or [{}])[0]
          print('[NQcv1 polling] close=%s chg=%s dir=%s time=%s' % (r.get('closePrice'), r.get('compareToPreviousClosePrice'), (r.get('compareToPreviousPrice') or {}).get('text'), d.get('time')))"
            # 운영 API
            curl -s "https://sunny-invest-dashboard.pages.dev/api/market" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          row=lambda k: '%s=%s(%s)' % (k, (d.get(k) or {}).get('price'), (d.get(k) or {}).get('src'))
          print('[운영API]', ' '.join(row(k) for k in ('usdkrw','gold','wti','ndxfut','ust10y','ust2y')), '_updated=%s' % d.get('_updated'))"
            echo
          }
          sample 1; sleep 35; sample 2; sleep 35; sample 3

      - name: 폴링 marketindex 실시간 후보 (지연 없는 대안 탐색)
        run: |
          for u in "https://polling.finance.naver.com/api/realtime/marketindex/exchange/FX_USDKRW" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/bond/US10YT%3DRR" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/metals/GCcv1" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/energy/CLcv1" \
                   "https://polling.finance.naver.com/api/realtime/worldstock/futures/GCcv1" \
                   "https://polling.finance.naver.com/api/realtime/worldstock/futures/CLcv1"; do
            echo "== $u"
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "$u" | head -c 400; echo
          done
