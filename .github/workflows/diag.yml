name: diag (수동 진단)

# 외부 데이터 소스 진단용 — 수동 실행 전용, 자동 트리거 없음.
# 네이버 시장지표·폴링 API 를 시간차 샘플링해 실시간 반영 여부를 확인한다.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 목표·손절 배포 확인 (임시)
        run: |
          s=$(curl -sL "https://sunny-invest-dashboard.pages.dev/signals")
          echo "목표손절 헤더: $(echo "$s" | grep -c '목표·손절')"
          echo "planFor 함수: $(echo "$s" | grep -c 'function planFor')"
          echo "atrLast 함수: $(echo "$s" | grep -c 'function atrLast')"

      - name: 러셀2000 네이버 소스 프로브 (임시)
        run: |
          H='-H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/"'
          for idx in ".RUT" "RUT" ".RUA"; do
            echo "== index/$idx/enrollStocks p1"
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
              "https://api.stock.naver.com/index/$idx/enrollStocks?page=1&pageSize=100" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              st=d.get('stocks') or []
              tp=d.get('totalCount') or d.get('total') or '?'
              print('total=%s page1=%d' % (tp, len(st)))
              for s in st[:3]:
                  print('  ', s.get('symbolCode'), s.get('stockName'), s.get('marketValue'), (s.get('stockExchangeType') or {}).get('code'))
              caps=[float(s.get('marketValueRaw') or 0) for s in st[:20]]
              print('  cap 정렬 확인(앞20):', 'DESC' if caps==sorted(caps,reverse=True) else caps[:5])
          except Exception as e: print('ERR', e, sys.stdin.read()[:120] if not sys.stdin.closed else '')"
          done
          echo "== index/.RUT/enrollStocks p5·p6 (500위권 존재 확인)"
          for p in 5 6; do
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
              "https://api.stock.naver.com/index/.RUT/enrollStocks?page=$p&pageSize=100" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin); st=d.get('stocks') or []
              print('p$p:', len(st), '건', (st[0].get('symbolCode') if st else ''))
          except Exception as e: print('p$p ERR', e)"
          done

      - name: 시간차 샘플링 (3회 × 35초)
        run: |
          sample() {
            echo "---- sample $1 @ $(date -u +%H:%M:%S) ----"
            # productDetail: 시간 필드 포함 앞부분을 그대로 출력 (어떤 timestamp 필드가 있는지 확인)
            for pair in "bond US10YT=RR" "bond US2YT=RR" "exchange FX_USDKRW" "metals GCcv1" "energy CLcv1"; do
              set -- $pair
              body=$(curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
                "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=$1&reutersCode=$2")
              echo "[$1/$2] $(echo "$body" | python3 -c "
          import json,sys
          try:
              v=json.load(sys.stdin).get('result') or {}
              keys=[k for k in v.keys() if 'ime' in k or 'ate' in k or 'At' in k]
              print('close=%s chg=%s pct=%s | 시간필드: %s' % (v.get('closePrice'), v.get('compareToPreviousClosePrice'), v.get('fluctuationsRatio'), {k:v.get(k) for k in keys}))
          except Exception as e: print('ERR', e)")"
            done
            # 폴링 선물 (NQcv1)
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" \
              "https://polling.finance.naver.com/api/realtime/worldstock/futures/NQcv1" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); r=(d.get('datas') or [{}])[0]
          print('[NQcv1 polling] close=%s chg=%s dir=%s time=%s' % (r.get('closePrice'), r.get('compareToPreviousClosePrice'), (r.get('compareToPreviousPrice') or {}).get('text'), d.get('time')))"
            # 운영 API
            curl -s "https://sunny-invest-dashboard.pages.dev/api/market" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          row=lambda k: '%s=%s(%s)' % (k, (d.get(k) or {}).get('price'), (d.get(k) or {}).get('src'))
          print('[운영API]', ' '.join(row(k) for k in ('usdkrw','gold','wti','ndxfut','ust10y','ust2y')), '_updated=%s' % d.get('_updated'))"
            echo
          }
          sample 1; sleep 35; sample 2; sleep 35; sample 3

      - name: 폴링 marketindex 실시간 후보 (지연 없는 대안 탐색)
        run: |
          for u in "https://polling.finance.naver.com/api/realtime/marketindex/exchange/FX_USDKRW" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/bond/US10YT%3DRR" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/metals/GCcv1" \
                   "https://polling.finance.naver.com/api/realtime/marketindex/energy/CLcv1" \
                   "https://polling.finance.naver.com/api/realtime/worldstock/futures/GCcv1" \
                   "https://polling.finance.naver.com/api/realtime/worldstock/futures/CLcv1"; do
            echo "== $u"
            curl -s -H "User-Agent: Mozilla/5.0" -H "Referer: https://m.stock.naver.com/" "$u" | head -c 400; echo
          done
