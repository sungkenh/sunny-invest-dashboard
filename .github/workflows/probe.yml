name: probe (임시 진단)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 확정 후보 검증
        run: |
          NH='-H User-Agent:Mozilla/5.0 -H Referer:https://m.stock.naver.com/'
          echo "== exchangeWorld FX_USDJPY"
          curl -s $NH "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=exchangeWorld&reutersCode=FX_USDJPY" | head -c 400; echo; echo
          echo "== energy CLcv1 (WTI 선물)"
          curl -s $NH "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=energy&reutersCode=CLcv1" | head -c 400; echo; echo
          echo "== metals GCcv1 (금 선물)"
          curl -s $NH "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=metals&reutersCode=GCcv1" | head -c 400; echo; echo
          echo "== energy OIL_CL / metals CMDT_GC (데스크톱 코드 재확인)"
          curl -s $NH "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=energy&reutersCode=OIL_CL" | head -c 200; echo
          curl -s $NH "https://m.stock.naver.com/front-api/marketIndex/productDetail?category=metals&reutersCode=CMDT_GC" | head -c 200; echo; echo
          echo "== TradingView symbol 엔드포인트"
          curl -s -H "User-Agent: Mozilla/5.0" \
            "https://scanner.tradingview.com/symbol?symbol=TVC%3AUSOIL&fields=close,change,change_abs&no_404=true" -w "\n[%{http_code}]\n" | head -c 400; echo
          echo "== TradingView america scan"
          curl -s -X POST "https://scanner.tradingview.com/america/scan" -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0" \
            -d '{"symbols":{"tickers":["TVC:USOIL"]},"columns":["close","change_abs","change"]}' | head -c 300; echo; echo
          echo "== K200 야간선물 네이버 후보 (worldstock futures)"
          for c in KSc1 1KSc1 K2Icv1 KOScv1; do
            echo "-- $c"
            curl -s $NH "https://polling.finance.naver.com/api/realtime/worldstock/futures/$c" | head -c 250; echo
          done
