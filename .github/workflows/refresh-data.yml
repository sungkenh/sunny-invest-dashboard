name: 대시보드 데이터 자동 갱신

# 클라우드(깃허브)에서 주기적으로 data/*.json 을 재수집하고 커밋합니다.
# 커밋이 푸시되면 Netlify 가 자동으로 다시 배포 → 배포본 데이터가 최신으로 유지됩니다.
# (시세·뉴스·영상·경제지표 등은 서버리스 함수가 요청 시 라이브로도 제공하며,
#  이 워크플로는 한국/원거리 실적 일정 등 '정적 스냅샷'과 폴백 파일을 갱신합니다.)
#
# 수집 스크립트는 pipeline/ 에 있고 결과를 data/ 로 복사합니다.
# (repo 루트에 requirements.txt 를 두지 않아 Netlify 가 파이썬 빌드를 시도하지 않습니다.)

on:
  schedule:
    - cron: '0 */6 * * *'      # 6시간마다 (UTC). 더 자주 원하면 '0 */3 * * *' 등으로 조정
  workflow_dispatch: {}          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write                # data/*.json 커밋·푸시 권한

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: 데이터 재수집 (개별 실패 허용)
        working-directory: pipeline
        run: |
          python fetch_market.py    || echo "::warning::market 수집 실패(스킵)"
          python fetch_calendar.py  || echo "::warning::calendar 수집 실패(스킵)"
          python fetch_news.py      || echo "::warning::news 수집 실패(스킵)"
          python fetch_videos.py    || echo "::warning::videos 수집 실패(스킵)"
          python fetch_watchlist.py || echo "::warning::watchlist 수집 실패(스킵)"

      - name: 결과를 data/ 로 복사
        run: |
          mkdir -p data
          cp pipeline/data/*.json data/ 2>/dev/null || true

      - name: 변경분 커밋·푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 대시보드 스냅샷 자동 갱신"
            git push
          fi
