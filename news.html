<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실시간 투자 뉴스 · 써니의 투자 인사이트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"></noscript>
<link rel="prefetch" href="index.html">
<style>
  :root{
    --bg:#0a0b0d; --panel:#16181c; --panel2:#1c1f25; --border:#2a2d34;
    --text:#f5f7fa; --muted:#a8acb3; --muted2:#7c828a;
    --accent:#1268ff; --accent2:#5b8cff; --gold:#f4b000;
    --up:#f6465d; --down:#3b82f6; --chip:#1c1f25;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text); font-family:"Pretendard Variable","Pretendard","Inter","Segoe UI",-apple-system,"Malgun Gothic",sans-serif; font-size:14px; line-height:1.5; letter-spacing:-0.01em;
  }
  body.light{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f2f3f5; --border:#dee1e6;
    --text:#0a0b0d; --muted:#5b616e; --muted2:#8a909a;
    --accent:#0052ff; --accent2:#3d7bff; --gold:#a8780a;
    --up:#d4243a; --down:#2f6bdb; --chip:#eef0f3;
  }
  body.light header.topbar{background:rgba(255,255,255,.82)}
  .btn{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  a{color:inherit;text-decoration:none}
  .mono{font-variant-numeric:tabular-nums}

  header.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:10px 22px;background:rgba(10,14,23,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#ffffff;font-weight:900;font-size:13px}
  .brand small{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:0}
  nav.mainnav{display:flex;gap:4px}
  nav.mainnav a{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid transparent}
  nav.mainnav a:hover{color:var(--text);border-color:var(--border)}
  nav.mainnav a.active{color:#ffffff;background:var(--accent)}
  .spacer{flex:1}
  .clock{font-size:13px;color:var(--muted);font-weight:600}
  .demo-badge{font-size:10.5px;font-weight:800;color:var(--gold);border:1px solid #4a3a12;background:#1c1607;padding:4px 8px;border-radius:6px;letter-spacing:.6px}

  /* 필터바 (2행: 섹터 칩 + 오늘의 키워드) */
  .filterbar{position:sticky;top:53px;z-index:40;display:flex;flex-direction:column;align-items:stretch;gap:9px;flex-wrap:wrap;
    padding:11px 22px;background:rgba(10,14,23,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .fb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fb-tag{font-size:11px;font-weight:800;color:var(--muted2);flex:none;letter-spacing:.3px}
  .fb-tag.hot{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--muted);
    padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
  .chip:hover{color:var(--text)} .chip.on{color:#ffffff;background:var(--accent);border-color:var(--accent)}
  .chip .cn{margin-left:5px;font-size:10px;font-weight:700;color:var(--muted2);background:var(--panel2);border-radius:8px;padding:0 5px;min-width:15px;text-align:center}
  .chip.on .cn{color:#fff;background:rgba(255,255,255,.22)}
  .tchip{cursor:pointer;border:1px dashed var(--border);background:var(--panel);color:var(--muted);
    padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
  .tchip:hover{color:var(--text);border-color:var(--gold)}
  .tchip.on{color:#1a1400;background:var(--gold);border-style:solid;border-color:var(--gold)}
  .tchip .cn{margin-left:5px;font-size:10px;color:var(--muted2)} .tchip.on .cn{color:#3a2c00}
  .trend-empty{font-size:11px;color:var(--muted2)}
  .search{margin-left:auto;display:flex;gap:8px;align-items:center}
  .search input{background:#0a1120;border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:9px;font-size:13px;width:220px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel)}
  .seg button{border:none;background:transparent;color:var(--muted);padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--accent);color:#ffffff}

  main{padding:18px 22px 50px;max-width:1500px;margin:0 auto}
  .sectit{display:flex;align-items:center;gap:9px;margin:6px 2px 12px;font-size:14px;font-weight:800}
  .sectit .cnt{font-size:11px;color:var(--muted);font-weight:600;border:1px solid var(--border);padding:1px 7px;border-radius:6px}
  .rank-note{font-size:11px;color:var(--muted2);font-weight:500;margin-left:auto}

  /* HOT 헤드라인 */
  .hotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .hotcard{border:1px solid var(--border);border-radius:13px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:14px;cursor:pointer;position:relative;overflow:hidden}
  .hotcard:hover{border-color:var(--accent)}
  .hotcard .badge{font-size:10px;font-weight:800;color:var(--gold);border:1px solid #4a3a12;background:#1c1607;padding:1px 6px;border-radius:5px}
  .hotcard h4{margin:9px 0 7px;font-size:14px;line-height:1.4;font-weight:700}
  .hotcard .sum{font-size:11.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hotcard .meta{font-size:10.5px;color:var(--muted2);margin-top:9px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}

  /* 2열 KR/US */
  .news-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .news-col{border:1px solid var(--border);border-radius:14px;background:var(--panel);overflow:hidden}
  .news-col > .colhead{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:1}
  .news-col > .colhead h3{margin:0;font-size:14px;font-weight:800}
  .news-col .feed{max-height:1400px;overflow:auto}
  .feed::-webkit-scrollbar{width:8px}.feed::-webkit-scrollbar-thumb{background:#22324f;border-radius:8px}
  .nitem{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid #141d31;cursor:pointer}
  .nitem:hover{background:#101a2e}
  .nitem .rk{font-weight:800;color:var(--muted2);width:20px;text-align:center;flex:none;font-size:13px;padding-top:1px}
  .nitem .ti{font-size:13.5px;line-height:1.45;font-weight:600}
  .nitem .sum{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nitem .meta{font-size:10.5px;color:var(--muted2);margin-top:6px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .ctag{border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--accent)}
  .hot{color:var(--gold);font-weight:800;border:1px solid #4a3a12;background:#1c1607;padding:0 5px;border-radius:4px}
  .src{color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--muted2);font-size:13px}

  /* 🚨 속보 */
  .brk-toggle{cursor:pointer;border:1px solid var(--up);background:rgba(246,70,93,.12);color:var(--up);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;flex:none}
  .brk-toggle:hover{filter:brightness(1.1)}
  .brk-toggle.on{background:var(--up);color:#fff}
  .brk-toggle .cn{margin-left:5px;font-size:10px;background:rgba(255,255,255,.18);border-radius:8px;padding:0 5px;min-width:15px;text-align:center}
  .chip.war{border-color:var(--up);color:var(--up)}
  .chip.war .cn{color:var(--up)}
  .chip.war.on{background:var(--up);border-color:var(--up);color:#fff}
  .chip.war.on .cn{color:#fff;background:rgba(255,255,255,.22)}
  .brk{color:#fff;background:var(--up);font-weight:800;border-radius:4px;padding:0 5px;font-size:10px;letter-spacing:.2px}
  .nitem.isbrk{box-shadow:inset 3px 0 0 var(--up)}
  .brk-strip{display:flex;align-items:center;gap:12px;border:1px solid var(--up);background:rgba(246,70,93,.08);border-radius:12px;padding:10px 14px;margin-bottom:18px}
  .brk-strip .lab{flex:none;font-size:12.5px;font-weight:900;color:var(--up);display:flex;align-items:center;gap:7px}
  .brk-strip .lab .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px rgba(246,70,93,.22);animation:brkpulse 1.4s infinite}
  @keyframes brkpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .brk-strip .items{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none}
  .brk-strip .items::-webkit-scrollbar{display:none}
  .brk-strip .bi{flex:none;font-size:12.5px;font-weight:600;color:var(--text);border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:5px 12px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brk-strip .bi:hover{border-color:var(--up)}
  .brk-strip .bi .tm{color:var(--muted2);font-size:10.5px;margin-left:5px}

  footer{padding:22px;color:var(--muted2);font-size:11px;line-height:1.6;border-top:1px solid var(--border);margin-top:24px}
  footer b{color:var(--accent2)}

  @media(max-width:1100px){ .hotrow{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:840px){ .news-cols{grid-template-columns:1fr} .search input{width:150px} }
  /* ===== 페이지 전환 부드럽게: Cross-Document View Transitions(지원 브라우저). 미지원 시 일반 이동으로 무해 폴백 ===== */
  @view-transition{ navigation:auto; }
  ::view-transition-old(root){ animation:vt-out .14s ease both; }
  ::view-transition-new(root){ animation:vt-in .18s ease both; }
  @keyframes vt-out{ to{ opacity:0 } }
  @keyframes vt-in{ from{ opacity:0 } }
  header.topbar{ view-transition-name:topbar; }                 /* 상단바는 전환 내내 고정(깜빡임 방지) */
  ::view-transition-old(topbar),::view-transition-new(topbar){ animation:none; }
  @media (prefers-reduced-motion:reduce){ ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){ animation:none!important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><div class="logo">S</div>써니의&nbsp;투자&nbsp;인사이트<small>실시간 투자 뉴스</small></div>
  <nav class="mainnav">
    <a href="index.html">대시보드</a>
    <a href="sectors.html">섹터 가이드</a>
    <a href="news.html" class="active">실시간 뉴스</a>
    <a href="schedule.html">일정</a>
    <a href="videos.html">추천 영상</a>
    <a href="heatmap.html">히트맵</a>
    <a href="signals.html">매매 시그널</a>
    <a href="plan.html">분할 플래너</a>
    <a href="yieldgap.html">일드갭</a>
  </nav>
  <div class="spacer"></div>
  <button class="btn" id="themeToggle">🌙 다크</button>
  <span class="clock mono" id="clock">--:--:--</span>
  <span class="demo-badge" id="upd" style="color:#22c55e;border-color:#14532d;background:#06210f">● 실시간</span>
</header>

<section class="filterbar">
  <div class="fb-row">
    <span class="fb-tag">분야</span>
    <span class="brk-toggle" id="brk-toggle" title="속보만 모아보기">🚨 속보<span class="cn" id="brk-cn">0</span></span>
    <div class="chips" id="cat-chips"></div>
    <div class="search">
      <div class="seg" id="sort-seg">
        <button data-s="latest" class="on">최신순</button>
        <button data-s="popular">인기순</button>
      </div>
      <input id="q" placeholder="키워드 검색 (예: HBM, 금리)" />
    </div>
  </div>
  <div class="fb-row">
    <span class="fb-tag hot">🔥 오늘의 키워드</span>
    <div class="chips" id="trend-chips"></div>
  </div>
</section>

<main>
  <section class="brk-strip" id="brk-strip" style="display:none"></section>

  <div class="sectit">🔥 HOT 헤드라인 <span class="rank-note">추천 기준: 출처 신뢰도 × 발행 속도(시간당 조회·언급) × 관심종목 관련도</span></div>
  <section class="hotrow" id="hotrow"></section>

  <div class="news-cols">
    <div class="news-col">
      <div class="colhead"><h3>🇰🇷 한국</h3><span class="sectit cnt" id="kr-cnt" style="margin:0"></span></div>
      <div class="feed" id="kr-list"></div>
    </div>
    <div class="news-col">
      <div class="colhead"><h3>🇺🇸 미국</h3><span class="sectit cnt" id="us-cnt" style="margin:0"></span></div>
      <div class="feed" id="us-list"></div>
    </div>
  </div>
</main>

<footer id="disc"></footer>

<script>
/* ============================================================
   실시간 투자 뉴스 페이지: 목업 (샘플 데이터)
   실제 서비스: RSS(한경·매경·연합)+Finnhub News+Marketaux 등을 수집해
   data/news.json 으로 떨군 뒤 아래 SAMPLE_NEWS 를 교체.
   각 항목 필드: mk(kr|us) cat src tm min(분전) pop(인기점수) sum hot
   ============================================================ */
let SAMPLE_NEWS = [
  // 🚨 속보·전쟁(예시): 실데이터(news.json) 로드 전 폴백
  {mk:'kr',cat:'전쟁·지정학',src:'연합뉴스',tm:'7분 전',min:7,pop:99,hot:true,breaking:true,ti:'[속보] 이란, 이스라엘 본토에 탄도미사일 발사… 호르무즈 긴장 고조',sum:'중동 지정학 리스크 재부각. 국제유가 급등 우려로 정유·방산주 단기 변동성 확대 전망.'},
  {mk:'kr',cat:'국내증시',src:'한국경제',tm:'14분 전',min:14,pop:96,hot:true,breaking:true,ti:'[속보] 코스피, 美반도체 랠리에 장중 사상 첫 9300선 돌파',sum:'필라델피아 반도체지수 급등에 삼성전자·SK하이닉스 강세. 외국인·개인 동반 매수세.'},
  {mk:'us',cat:'전쟁·지정학',src:'Reuters',tm:'20분 전',min:20,pop:94,breaking:true,ti:'[속보] 미·이란 종전 합의 서명식 돌연 연기… 백악관 "물류 미해결"',ti_en:'BREAKING: US-Iran ceasefire signing postponed, White House cites logistics',sum:'합의 불확실성 부각. 유가·안전자산 변동성 확대 가능성.'},
  // 🇰🇷 한국
  {mk:'kr',cat:'반도체',src:'전자신문',tm:'38분 전',min:38,pop:95,hot:true,ti:'SK하이닉스 HBM4 샘플 출하 임박… 엔비디아 퀄 통과 관측',sum:'차세대 고대역폭 메모리 HBM4 샘플을 주요 고객사에 공급하며 연내 양산 채비. 엔비디아 차세대 가속기 탑재 여부가 관전 포인트.'},
  {mk:'kr',cat:'반도체',src:'서울경제',tm:'45분 전',min:45,pop:90,hot:true,ti:'삼성전자, HBM3E 엔비디아 공급 승인 임박 관측',sum:'엔비디아 품질 인증 막바지 단계라는 관측이 잇따르며 메모리 사업 반등 기대. 파운드리 가동률 회복도 동반.'},
  {mk:'kr',cat:'방산',src:'매일경제',tm:'51분 전',min:51,pop:80,ti:'한화에어로스페이스, 폴란드 추가 수주 협상… 방산 슈퍼사이클',sum:'K9 자주포·천무 등 2차 실행계약 협상이 진행 중. 장기 수주잔고 가시성이 높아지며 밸류에이션 재평가 기대.'},
  {mk:'kr',cat:'국내증시',src:'연합인포맥스',tm:'1시간 전',min:62,pop:72,ti:'코스피 외국인 6거래일 연속 순매수… 반도체에 집중',sum:'외국인 자금이 대형 반도체주를 중심으로 유입. 원화 강세 전환 기대가 수급을 뒷받침.'},
  {mk:'kr',cat:'2차전지',src:'이데일리',tm:'2시간 전',min:120,pop:64,ti:'2차전지株 반등… 에코프로비엠·포스코퓨처엠 강세',sum:'리튬 가격 바닥 인식과 하반기 출하 회복 기대가 맞물리며 소재주 반등. 전기차 캐즘 우려는 여전.'},
  {mk:'kr',cat:'환율',src:'이데일리',tm:'3시간 전',min:182,pop:55,ti:'원/달러 1,378원… 외환당국 구두개입 경계감',sum:'달러 강세 진정에도 변동성 확대. 당국의 미세조정 가능성에 시장 경계.'},

const fmtClock=()=>{try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hourCycle:'h23',weekday:'short',year:'2-digit',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);const wk=['일','월','화','수','목','금','토'][{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday]];document.getElementById('clock').textContent=o.year+'년 '+(+o.month)+'월 '+(+o.day)+'일('+wk+') '+o.hour+':'+o.minute+':'+o.second;}catch(e){}};
/* _updated(서버리스 toISOString·Actions UTC) → 한국시간(KST) 표시. 오프셋 없으면 UTC로 간주. */
function kstUpd(iso, withDate){
  if(!iso) return '';
  const s=String(iso).replace(' ','T');
  const d=new Date(/[Zz]|[+\-]\d\d:?\d\d$/.test(s)?s:s+'Z');
  if(isNaN(d)) return s.replace('T',' ').slice(withDate?5:11,16);
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const g=t=>(p.find(x=>x.type===t)||{}).value||'';
  return (withDate?g('month')+'-'+g('day')+' ':'')+g('hour')+':'+g('minute');
}

   전쟁·지정학은 중요도가 높아 '전체' 다음에 고정 노출(붉은 강조). */
function categoryCounts(){
  const m={};
  SAMPLE_NEWS.forEach(n=>{ if(n.cat) m[n.cat]=(m[n.cat]||0)+1; });
  const arr=Object.entries(m).map(([c,n])=>({c,n})).sort((a,b)=>b.n-a.n || a.c.localeCompare(b.c,'ko'));
  const war=arr.filter(x=>x.c==='전쟁·지정학'), rest=arr.filter(x=>x.c!=='전쟁·지정학');
  return [{c:'전체', n:SAMPLE_NEWS.length}, ...war, ...rest];
}
function renderChips(){
  document.getElementById('cat-chips').innerHTML = categoryCounts().map(({c,n})=>{
    const war=c==='전쟁·지정학';
    return `<span class="chip ${c===state.cat?'on':''} ${war?'war':''}" data-c="${c}">${war?'🔴 ':''}${c}<span class="cn">${n}</span></span>`;
  }).join('');
  document.querySelectorAll('#cat-chips .chip').forEach(ch=>ch.addEventListener('click',()=>{
    state.cat=ch.dataset.c; renderChips(); renderAll();
  }));
}

function trendingKeywords(){
  return KW_DICT.map(kw=>{
    const low=kw.toLowerCase(); let n=0;
    for(const it of SAMPLE_NEWS){ if((it.ti||'').toLowerCase().includes(low)) n++; }   // 한국어 표시 제목 기준
    return {kw,n};
  }).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,12);
}
function renderTrending(){
  const host=document.getElementById('trend-chips'); if(!host) return;

    const k=ch.dataset.k;
    state.q=(state.q===k)?'':k;                       // 토글
    document.getElementById('q').value=state.q;
    renderTrending(); renderAll();
  }));

function match(n){
  if(state.breaking && !n.breaking) return false;
  if(state.cat!=='전체' && n.cat!==state.cat) return false;
  if(state.q){ const q=state.q.toLowerCase(); if(!(n.ti.toLowerCase().includes(q)||n.sum.toLowerCase().includes(q)||n.cat.toLowerCase().includes(q))) return false; }
  return true;
}
function sortFn(a,b){ return state.sort==='popular' ? b.pop-a.pop : a.min-b.min; }

/* 구글뉴스 RSS 링크는 클릭 시 'Google 뉴스' 중간 페이지에 머물러 원문이 늦게 열림 →
   /api/go 로 보내 실제 기사 URL로 즉시 302 리다이렉트. 이미 실제 URL이면 그대로 사용. */
function articleHref(link){
  if(!link) return '#';
  return /news\.google\.com\/rss\/articles/.test(link) ? '/api/go?u='+encodeURIComponent(link) : link;
}
function itemHTML(n,i){
  return `<a class="nitem ${n.breaking?'isbrk':''}" href="${articleHref(n.link)}" ${n.link?'target="_blank" rel="noopener"':'onclick="return false"'}>
    <span class="rk mono">${i+1}</span>
    <span style="min-width:0">
      <div class="ti">${n.ti}</div>
      ${n.sum?`<div class="sum">${n.sum}</div>`:''}
      <div class="meta">${n.breaking?'<span class="brk">속보</span>':''}${n.hot?'<span class="hot">HOT</span>':''}<span class="ctag">${n.cat}</span><span class="src">${n.src} · ${n.tm}</span></div>
    </span>
  </a>`;
}
function renderCols(){
  const kr=SAMPLE_NEWS.filter(n=>n.mk==='kr'&&match(n)).sort(sortFn);
  const us=SAMPLE_NEWS.filter(n=>n.mk==='us'&&match(n)).sort(sortFn);
  document.getElementById('kr-cnt').textContent=kr.length+'건';
  document.getElementById('us-cnt').textContent=us.length+'건';
  document.getElementById('kr-list').innerHTML = kr.length? kr.map(itemHTML).join('') : '<div class="empty">'+(NEWS_LOADED?'조건에 맞는 한국 뉴스가 없습니다.':'실시간 뉴스를 불러오는 중…')+'</div>';
  document.getElementById('us-list').innerHTML = us.length? us.map(itemHTML).join('') : '<div class="empty">'+(NEWS_LOADED?'조건에 맞는 미국 뉴스가 없습니다.':'실시간 뉴스를 불러오는 중…')+'</div>';
}
function renderHot(){
  const hot=SAMPLE_NEWS.filter(n=>n.hot&&match(n)).sort((a,b)=>a.min-b.min).slice(0,4);
  document.getElementById('hotrow').innerHTML = hot.map(n=>`
    <a class="hotcard" href="${articleHref(n.link)}" ${n.link?'target="_blank" rel="noopener"':'onclick="return false"'} style="display:block">
      <span class="badge">🔥 HOT</span> <span style="font-size:11px;color:var(--muted)">${n.mk==='kr'?'🇰🇷 한국':'🇺🇸 미국'} · ${n.cat}</span>
      <h4>${n.ti}</h4>
      ${n.sum?`<div class="sum">${n.sum}</div>`:''}
      <div class="meta"><span class="src">${n.src} · ${n.tm}</span></div>
    </a>`).join('') || '<div class="empty" style="grid-column:1/-1">HOT 뉴스 없음</div>';
}
/* 🚨 속보 띠: 분야/검색 필터는 따르되 속보토글과 무관하게 최신 속보를 상단에 노출 */
function renderBreakingStrip(){
  const strip=document.getElementById('brk-strip'); if(!strip) return;
  const cn=document.getElementById('brk-cn'); if(cn) cn.textContent=SAMPLE_NEWS.filter(n=>n.breaking).length;
  const f=SAMPLE_NEWS.filter(n=>{ if(!n.breaking) return false;
    if(state.cat!=='전체'&&n.cat!==state.cat) return false;
    if(state.q){const q=state.q.toLowerCase(); if(!((n.ti||'').toLowerCase().includes(q)||(n.sum||'').toLowerCase().includes(q))) return false;}
    return true; }).sort((a,b)=>a.min-b.min).slice(0,10);
  if(!f.length){ strip.style.display='none'; return; }
  strip.style.display='';
  strip.innerHTML='<div class="lab"><span class="dot"></span>🚨 속보</div><div class="items">'
    + f.map(n=>`<a class="bi" href="${articleHref(n.link)}" ${n.link?'target="_blank" rel="noopener"':'onclick="return false"'} title="${(n.ti||'').replace(/"/g,'&quot;')}">${n.ti}<span class="tm">${n.tm}</span></a>`).join('')
    + '</div>';
}
function renderAll(){ renderBreakingStrip(); renderHot(); renderCols(); }

document.querySelectorAll('#sort-seg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#sort-seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.sort=b.dataset.s; renderAll();
}));
document.getElementById('q').addEventListener('input',e=>{ state.q=e.target.value.trim(); renderTrending(); renderAll(); });
document.getElementById('brk-toggle').addEventListener('click',()=>{
  state.breaking=!state.breaking;
  document.getElementById('brk-toggle').classList.toggle('on',state.breaking);
  renderAll();
});

document.getElementById('disc').innerHTML =
  '✅ <b>실시간</b> · 구글뉴스 RSS에서 헤드라인·출처·링크를 수집해 한국/미국·섹터별로 정리합니다(본문 복제 안 함, 클릭 시 원문으로 이동). ' +
  '<b>분야 칩</b>은 고정 목록이 아니라 <b>당일 수집된 기사 수 기준으로 정렬·표시</b>되며(기사 없는 섹터는 숨김, 옆 숫자=건수), ' +
  '<b>🔥 오늘의 키워드</b>는 그날 기사 제목에 자주 등장한 종목·테마를 자동 추출해 보여줍니다(클릭 시 해당 키워드로 필터). ' +
  '<b>🚨 속보</b>는 제목의 [속보]·긴급·BREAKING 표시를 자동 감지해 상단 띠와 토글로 따로 모아 보여주고, <b>🔴 전쟁·지정학</b> 분야를 상시 노출합니다. ' +
  '약 3분마다 갱신. 정보 제공 목적이며 투자 권유가 아닙니다. HOT은 발행 최신순으로 선별합니다.';

/* /api/news(서버리스) + 트럼프 Truth Social(/api/trump, 한국어 번역) 병합 */
let TRUMP_ITEMS=[];
function mergeTrump(){ SAMPLE_NEWS=SAMPLE_NEWS.filter(n=>n.cat!=='트럼프').concat(TRUMP_ITEMS); renderChips(); renderTrending(); renderAll(); }
/* 직전 뉴스 스캔을 브라우저에 보관(대시보드와 키 공유) → 페이지 진입 시 '오늘자 수집분'을 즉시 표시.
   캐시가 없을 때는 가짜 예시 대신 '불러오는 중'을 보여주고, 진짜 뉴스를 받으면 보관 후 표시. */
const NEWS_LS='alphadesk.newscache';
const DEMO_NEWS=SAMPLE_NEWS.slice();        // 완전 오프라인일 때만 쓰는 예시(진짜 뉴스엔 절대 안 섞임)
let NEWS_LOADED=false;
function newsCacheRead(){ try{ return JSON.parse(localStorage.getItem(NEWS_LS)||'null'); }catch(e){ return null; } }
function newsCacheWrite(items){ try{ localStorage.setItem(NEWS_LS, JSON.stringify({_updated:new Date().toISOString().slice(0,19), items})); }catch(e){} }
function seedNewsFromCache(){ const c=newsCacheRead(); if(c && Array.isArray(c.items) && c.items.length){ SAMPLE_NEWS=c.items; return true; } return false; }
function newsTs(d){ let s=((d&&d._updated)||'').trim().replace(' ','T'); if(!s) return 0; if(!/[zZ]$|[+\-]\d\d:?\d\d$/.test(s)) s+='Z'; const t=Date.parse(s); return isNaN(t)?0:t; }
async function loadNews(){
  let live=null, snap=null;
  try{ const r=await fetch('/api/news',{cache:'default'}); if(r.ok) live=await r.json(); }catch(e){}
  try{ const r=await fetch('data/news.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) snap=await r.json(); }catch(e){}
  // 라이브·스냅샷 중 더 최신(_updated)을 선택 → '예전 데이터로 되돌아감' 방지
  const cand=[live,snap].filter(x=>x&&x.items&&x.items.length).sort((a,b)=>newsTs(b)-newsTs(a));
  let d = cand[0] || newsCacheRead();        // 둘 다 실패면 보관본(직전 수집분)
  if(d && d.items && d.items.length){
    NEWS_LOADED=true;
    newsCacheWrite(d.items.filter(n=>n.cat!=='트럼프'));     // 오늘자 수집분 보관(트럼프는 /api/trump 별도)
    SAMPLE_NEWS=d.items; mergeTrump();
    const u=document.getElementById('upd'); if(u) u.textContent='● '+kstUpd(d._updated)+' 갱신';
  } else if(!SAMPLE_NEWS.length){
    SAMPLE_NEWS=DEMO_NEWS.slice(); NEWS_LOADED=true; mergeTrump();   // 완전 오프라인 → 예시로만 폴백
  }
}
function trumpKoR(items){ if(!items||!items.length) return -1; let k=0; for(const p of items){ if(/[가-힣]/.test(p.ti||'')) k++; } return k/items.length; }
async function loadTrump(){
  let live=null, snap=null;
  try{ const r=await fetch('/api/trump',{cache:'default'}); if(r.ok) live=await r.json(); }catch(e){}
  // 라이브 번역이 부실(한국어<50%)하거나 실패면 스냅샷도 받아 비교
  if(!live || !live.items || live.error || trumpKoR(live.items)<0.5){
    try{ const r=await fetch('data/trump.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) snap=await r.json(); }catch(e){}
  }
  const cand=[live,snap].filter(x=>x&&x.items&&x.items.length);
  if(!cand.length) return;
  cand.sort((a,b)=>trumpKoR(b.items)-trumpKoR(a.items));   // 한국어 비율 높은 쪽 우선
  TRUMP_ITEMS=cand[0].items; mergeTrump();
}

function setThemeClass(mode){var light=mode==='light';document.body.classList.toggle('light',light);var b=document.getElementById('themeToggle');if(b)b.textContent=light?'☀️ 라이트':'🌙 다크';}
(function(){var t=document.getElementById('themeToggle');if(t)t.addEventListener('click',function(){var m=document.body.classList.contains('light')?'dark':'light';setThemeClass(m);try{localStorage.setItem('alphadesk.theme',m)}catch(e){}});setThemeClass(localStorage.getItem('alphadesk.theme')||'dark');})();
if(!seedNewsFromCache()) SAMPLE_NEWS=[];   // 캐시 없으면 가짜 예시 대신 '불러오는 중' 표시
renderChips(); renderTrending(); renderAll(); fmtClock(); loadNews(); loadTrump();
setInterval(fmtClock,1000); setInterval(loadNews,180000); setInterval(loadTrump,300000);
</script>
